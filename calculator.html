<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Calculator</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 40px;
      background-color: #f4f4f9;
      color: #222;
    }

    h1 {
      color: #2c3e50;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      max-width: 700px;
      margin: 20px 0;
      box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    }

    th, td {
      border: 1px solid #ccc;
      text-align: center;
      padding: 10px 14px;
    }

    th {
      background-color: #2c3e50;
      color: white;
    }

    tr:nth-child(even) {
      background-color: #f2f2f2;
    }

    tr:hover {
      background-color: #e0eefc;
    }

    .error {
      color: #b00020;
      font-weight: bold;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      text-decoration: none;
      color: #2c3e50;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>Simple Calculator</h1>
  <p>Answer the prompts to enter numbers and an operator. Click "Cancel" on any prompt to stop.</p>

  <!-- All logic lives in calculator.js -->
  <script src="calculator.js"></script>

  <p><a href="index.html">&larr; Back to Home</a></p>

</body>
</html>
